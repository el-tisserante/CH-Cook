<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH-Cook | L'assistant repas & courses en Suisse</title>
    <style>
        :root {
            --ch-red: #DA291C;
            --ch-red-hover: #b52014;
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #6C757D;
            --border-color: #E2E8F0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--ch-red);
            margin: 0 0 8px 0;
            font-size: 28px;
        }

        header p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }

        .card-section {
            background: #FAFAFA;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #FFF;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--ch-red);
        }

        .recipe-box {
            background: #FFF5F5;
            border-left: 5px solid var(--ch-red);
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 20px;
        }

        .recipe-box h3 {
            margin: 0 0 5px 0;
            color: var(--ch-red);
            font-size: 18px;
        }

        .recipe-box p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .shopping-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .shopping-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #EEEEEE;
            font-size: 15px;
        }

        .shopping-item:last-child {
            border-bottom: none;
        }

        .item-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-name input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--ch-red);
            cursor: pointer;
        }

        .total-banner {
            background: #1A1A1A;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 18px;
        }

        .total-price {
            color: #FFD700;
            font-weight: bold;
            font-size: 22px;
        }

        .btn {
            background-color: var(--ch-red);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--ch-red-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇨🇭 CH-Cook</h1>
        <p>L'application suisse de planification de repas et de courses connectées</p>
    </header>

    <div class="card-section">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label for="personnes">Nombre de personnes :</label>
                <input type="number" id="personnes" value="2" min="1" max="10" oninput="actualiserApp()">
            </div>
            <div>
                <label for="magasin">Enseigne choisie :</label>
                <select id="magasin" onchange="actualiserApp()">
                    <option value="Migros" data-coeff="1.0">Migros (M-Budget / Bio)</option>
                    <option value="Coop" data-coeff="1.02">Coop (Prix Garantie)</option>
                    <option value="Denner" data-coeff="0.88">Denner (Discounter)</option>
                    <option value="Aldi Suisse" data-coeff="0.85">Aldi Suisse</option>
                    <option value="Lidl Suisse" data-coeff="0.85">Lidl Suisse</option>
                    <option value="Manor Food" data-coeff="1.10">Manor Food (Terroir)</option>
                    <option value="Volg" data-coeff="1.05">Volg (Proximité)</option>
                </select>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <label for="recetteSelect">Sélectionnez votre recette :</label>
            <select id="recetteSelect" onchange="actualiserApp()">
                <option value="zurichoise">Emincé de veau à la zurichoise & Rösti</option>
                <option value="alpler">Älplermagronen (Macaronis des alpes)</option>
                <option value="fondue">Fondue moitié-moitié fribourgeoise</option>
                <option value="malakoffs">Malakoffs croustillants & Salade</option>
            </select>
        </div>
    </div>

    <div class="recipe-box" id="recipeHeader">
        <!-- Dynamique -->
    </div>

    <div class="card-section">
        <label>Liste de courses interactive pour <span id="labelMagasinNom" style="color:var(--ch-red)">Migros</span> :</label>
        <ul class="shopping-list" id="listeCourses">
            <!-- Dynamique -->
        </ul>
    </div>

    <div class="total-banner">
        <span>Estimation du panier :</span>
        <span class="total-price" id="totalBox">0.00 CHF</span>
    </div>

    <button class="btn" onclick="simulerCommande()">Générer le panier pour l'enseigne 🇨🇭</button>
</div>

<script>
    const recettes = {
        zurichoise: {
            nom: "Emincé de veau à la zurichoise",
            temps: "30 min",
            ingredients: [
                { nom: "Veau suisse (émincé)", baseQte: 400, unite: "g", prixRef: 14.50 },
                { nom: "Champignons de Paris", baseQte: 250, unite: "g", prixRef: 3.20 },
                { nom: "Crème entière suisse", baseQte: 200, unite: "ml", prixRef: 2.50 },
                { nom: "Oignons & Vin blanc", baseQte: 1, unite: "pqt", prixRef: 3.00 }
            ]
        },
        alpler: {
            nom: "Älplermagronen traditionnelles",
            temps: "25 min",
            ingredients: [
                { nom: "Macaronis suisses", baseQte: 250, unite: "g", prixRef: 1.80 },
                { nom: "Pommes de terre du pays", baseQte: 300, unite: "g", prixRef: 1.50 },
                { nom: "Gruyère AOP râpé", baseQte: 150, unite: "g", prixRef: 4.20 },
                { nom: "Compote de pommes", baseQte: 1, unite: "bocal", prixRef: 2.50 }
            ]
        },
        fondue: {
            nom: "Fondue moitié-moitié",
            temps: "20 min",
            ingredients: [
                { nom: "Vacherin Fribourgeois AOP", baseQte: 300, unite: "g", prixRef: 8.50 },
                { nom: "Gruyère AOP", baseQte: 300, unite: "g", prixRef: 7.80 },
                { nom: "Pain mi-blanc artisanal", baseQte: 400, unite: "g", prixRef: 2.80 },
                { nom: "Gousse d'ail & Fendant", baseQte: 1, unite: "pqt", prixRef: 4.50 }
            ]
        },
        malakoffs: {
            nom: "Malakoffs de Vinzel & Salade",
            temps: "20 min",
            ingredients: [
                { nom: "Fromage dur râpé (L'Etivaz/Gruyère)", baseQte: 400, unite: "g", prixRef: 9.00 },
                { nom: "Pain de mie tranché", baseQte: 1, unite: "paquet", prixRef: 2.50 },
                { nom: "Œufs & Ail", baseQte: 1, unite: "pqt", prixRef: 2.00 },
                { nom: "Salade verte & Sauce", baseQte: 1, unite: "sachet", prixRef: 3.20 }
            ]
        }
    };

    function actualiserApp() {
        const nbPersonnes = parseInt(document.getElementById('personnes').value) || 1;
        const selectMagasin = document.getElementById('magasin');
        const magasinNom = selectMagasin.value;
        const coeffPrix = parseFloat(selectMagasin.options[selectMagasin.selectedIndex].getAttribute('data-coeff'));
        
        const choixKey = document.getElementById('recetteSelect').value;
        const recette = recettes[choixKey];

        document.getElementById('labelMagasinNom').innerText = magasinNom;

        // Facteur proportionnel (base 2 personnes)
        const facteur = nbPersonnes / 2;

        // En-tête recette
        document.getElementById('recipeHeader').innerHTML = `
            <h3>${recette.nom}</h3>
            <p>Pour ${nbPersonnes} personnes — ⏱️ Temps de préparation : ${recette.temps}</p>
        `;

        let listeHtml = '';
        let totalPrix = 0;

        recette.ingredients.forEach((ing, index) => {
            const qteCalc = Math.round(ing.baseQte * facteur);
            // Application d'un coefficient fictif selon l'enseigne choisie (discounter vs premium)
            const prixCalc = (ing.prixRef * facteur) * coeffPrix;
            totalPrix += prixCalc;

            listeHtml += `
                <li class="shopping-item">
                    <div class="item-name">
                        <input type="checkbox" id="item-${index}">
                        <label for="item-${index}" style="margin:0; font-weight:normal; cursor:pointer;">
                            <b>${qteCalc} ${ing.unite}</b> de ${ing.nom}
                        </label>
                    </div>
                    <span style="color: var(--text-muted); font-weight: 500;">~${prixCalc.toFixed(2)} CHF</span>
                </li>
            `;
        });

        document.getElementById('listeCourses').innerHTML = listeHtml;
        document.getElementById('totalBox').innerText = `${totalPrix.toFixed(2)} CHF`;
    }

    function simulerCommande() {
        const magasin = document.getElementById('magasin').value;
        alert(`🇨🇭 Démo Pitch : Redirection simulée vers le panier digital de ${magasin}. Prêt à présenter le projet aux investisseurs !`);
    }

    window.onload = actualiserApp;
</script>

</body>
</html>
